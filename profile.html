<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="查看知乎授权用户的基础资料、关注与公开创作。" />
    <link rel="icon" href="/assets/guiyun-mark.svg" />
    <title>我的知乎｜归云·知脉</title>
    <link rel="stylesheet" href="/assets/styles/styles.css" />
    <link rel="stylesheet" href="/assets/styles/ui.css" />
  </head>
  <body class="profile-page">
    <header class="topbar profile-topbar">
      <a class="brand brand-link" href="/"><b>归云·知脉</b><small>我的知乎</small></a>
      <nav>
        <a class="button profile-nav-link" href="/" aria-label="返回阅读"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z"></path><path d="M8 16h10M9 8h5"></path></svg><span>阅读</span></a>
        <a class="button profile-nav-link" href="/network" aria-label="进入网络"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 5 4 12l8 7 7-9M7 5l5 14"></path><circle cx="7" cy="5" r="2"></circle><circle cx="4" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle><circle cx="19" cy="10" r="2"></circle></svg><span>网络</span></a>
        <button id="logout">退出登录</button>
      </nav>
    </header>
    <main class="profile-shell">
      <section id="profile-card" class="profile-card" aria-live="polite">
        <div id="profile-avatar" class="profile-avatar" aria-hidden="true">知</div>
        <div><span class="profile-kicker">知乎 OAuth 已授权</span><h1 id="profile-name">正在读取用户资料…</h1><p id="profile-headline">请稍候</p></div>
      </section>
      <div id="oauth-security-notice" class="oauth-security-notice" role="status" hidden></div>
      <section class="profile-content">
        <div class="profile-tabs" role="tablist" aria-label="知乎用户信息">
          <button id="followees-tab" class="active" role="tab" aria-selected="true" data-tab="followees">关注的人</button>
          <button id="contents-tab" role="tab" aria-selected="false" data-tab="contents">创作信息</button>
        </div>
        <div id="profile-message" class="profile-message" aria-live="polite"></div>
        <div id="followees-panel" class="profile-list" role="tabpanel"></div>
        <div id="contents-panel" class="profile-list" role="tabpanel" hidden></div>
        <button id="load-more" class="profile-load-more" hidden>加载更多</button>
      </section>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/profile-app.js"></script>
  </body>
</html>
