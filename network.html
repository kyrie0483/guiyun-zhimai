<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="归云独立知识网络工作区。" />
    <link rel="icon" href="/assets/guiyun-mark.svg" />
    <title>归云·知脉｜归云网络</title>
    <link rel="stylesheet" href="/assets/styles/styles.css" />
    <link rel="stylesheet" href="/assets/styles/ui.css" />
  </head>
  <body class="network-page">
    <header class="topbar network-topbar">
      <a class="brand brand-link" href="/"><b>归云·知脉</b></a>
      <nav>
        <a class="network-chrome-button" href="/" aria-label="返回阅读" data-tooltip="返回阅读">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"></path><path d="M9 12h10"></path></svg>
          <span class="sr-only">返回阅读</span>
        </a>
        <span id="api-state" class="badge">检查接口…</span>
        <a id="login" class="button primary" href="/api/auth/zhihu/start">知乎登录</a>
      </nav>
    </header>

    <main class="network-page-layout">
      <aside class="network-navigation" aria-label="知识网络导航">
        <button id="collapse-left-panel" class="network-panel-toggle panel-toggle-inside panel-toggle-left" type="button" aria-label="收起知识网络导航" data-tooltip="收起左栏">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 3v18"></path></svg>
        </button>
        <div class="network-page-heading">
          <span class="archive-kicker">你的知识空间</span>
          <h1>归云网络</h1>
        </div>
        <label class="network-select-label" for="network-select">当前网络</label>
        <div class="network-select-row">
          <select id="network-select" aria-label="切换知识网络"></select>
          <button id="create-network" class="network-create-button" type="button" aria-label="新建网络" data-tooltip="新建网络">
            <img src="/assets/guiyun-mark.svg" alt="" /><span aria-hidden="true">＋</span>
          </button>
        </div>
        <div class="network-manage-actions" role="toolbar" aria-label="管理当前网络">
          <button id="rename-network" type="button" aria-label="重命名当前网络" title="重命名"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path></svg></button>
          <button id="trash-network" type="button" aria-label="将当前网络移入回收站" title="移入回收站"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"></path></svg></button>
          <button id="open-network-trash" type="button" aria-label="打开网络回收站" title="回收站"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 6h14l-1 14H6L5 6Z"></path><path d="M9 10v6M15 10v6"></path></svg><b id="network-trash-count">0</b></button>
        </div>
        <dl class="network-stats">
          <div><dt id="node-count">0</dt><dd>节点</dd></div>
          <div><dt id="edge-count">0</dt><dd>关系</dd></div>
        </dl>
        <div class="network-sidebar-utilities" role="toolbar" aria-label="工作区设置">
          <button id="ai-chat-toggle" class="network-utility-button" type="button" aria-label="打开 AI 对话" data-tooltip="AI 对话" aria-controls="ai-chat-panel" aria-expanded="false">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4Z"></path><path d="M8.5 9h7M8.5 12h4"></path></svg>
            <span class="sr-only">AI 对话</span>
          </button>
          <button id="ai-settings" class="network-utility-button" type="button" aria-label="打开 AI 设置与用量" data-tooltip="AI 设置与用量">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 3 1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3Z"></path><path d="m18 14 .7 2.3L21 17l-2.3.7L18 20l-.7-2.3L15 17l2.3-.7L18 14Z"></path></svg>
            <span class="sr-only">AI 设置与用量</span>
          </button>
        </div>
      </aside>

      <section class="network-canvas-panel network">
        <header class="network-canvas-header">
          <div class="network-canvas-title">
            <button id="expand-left-panel" class="network-panel-toggle panel-toggle-reopen" type="button" aria-label="展开知识网络导航" data-tooltip="展开左栏" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 3v18"></path></svg>
            </button>
            <div><span class="archive-kicker">当前画布</span><h2 id="active-network-name">默认网络</h2></div>
          </div>
          <div class="network-header-controls">
            <div class="actions network-action-bar" role="toolbar" aria-label="网络操作">
              <button id="integrate-new" class="network-primary-action integrate-new logo-action" aria-label="一键整合新增节点" data-tooltip="一键整合新增节点"><img src="/assets/guiyun-mark.svg" alt="" /><span>一键整合</span><b id="new-node-count">0</b></button>
              <div class="network-edit-group">
                <button id="network-edit-toggle" class="network-primary-action" type="button" aria-expanded="false" aria-controls="network-edit-menu">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path></svg><span>编辑网络</span>
                </button>
                <div id="network-edit-menu" class="network-edit-menu" role="menu" hidden>
                  <button id="create-node" role="menuitem" aria-label="手动添加节点"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="8" width="10" height="9" rx="3"></rect><path d="M18 4v6M15 7h6"></path></svg><span><b>添加节点</b><small>手动创建一个知识节点</small></span></button>
                  <button id="create-edge" role="menuitem" aria-label="手动添加关系"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="7" r="3"></circle><path d="m9 11 6-3"></path><path d="M18 15v6M15 18h6"></path></svg><span><b>添加关系</b><small>连接两个已有节点</small></span></button>
                  <button id="ai-connect" role="menuitem" aria-label="AI 连接节点"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 3 1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3Z"></path><circle cx="5" cy="17" r="2.5"></circle><circle cx="19" cy="17" r="2.5"></circle><path d="M7.5 17h9"></path></svg><span><b>AI 连接</b><small>生成待确认的关系草案</small></span></button>
                  <button id="ai-node" role="menuitem"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="3"></rect><path d="M8.5 9h7M8.5 13h5"></path></svg><span><b>总结节点</b><small>总结选择的节点内容</small></span></button>
                  <button id="ai-edge" role="menuitem"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="12" r="3"></circle><path d="M9 12h6"></path><path d="m12 8 2 4-2 4"></path></svg><span><b>总结关系</b><small>总结关系两端与依据</small></span></button>
                  <button id="ai-network" role="menuitem"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"></circle><circle cx="18" cy="7" r="2.5"></circle><circle cx="12" cy="18" r="2.5"></circle><path d="m8 8.5 2.7 7M16 8.5l-2.7 7M8.5 7h7"></path></svg><span><b>总结网络</b><small>生成全网总结草案</small></span></button>
                </div>
              </div>
            </div>
            <button id="expand-right-panel" class="network-panel-toggle panel-toggle-reopen" type="button" aria-label="展开对象详情" data-tooltip="展开右栏" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24"><g transform="translate(24 0) scale(-1 1)"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 3v18"></path></g></svg>
            </button>
          </div>
        </header>
        <div id="graph"></div>
        <div id="summary" class="summary" hidden></div>
      </section>

      <aside class="network-inspector" aria-label="对象详情与待确认草案">
        <button id="collapse-right-panel" class="network-panel-toggle panel-toggle-inside panel-toggle-right" type="button" aria-label="收起对象详情" data-tooltip="收起右栏">
          <svg aria-hidden="true" viewBox="0 0 24 24"><g transform="translate(24 0) scale(-1 1)"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 3v18"></path></g></svg>
        </button>
        <section>
          <div class="heading"><b>对象详情</b><small>点击节点或关系</small></div>
          <div id="node-detail" class="detail"><p>选择节点或关系查看来源、说明和编辑操作。</p></div>
        </section>
        <section class="proposal-panel">
          <div class="heading"><b>待确认草案</b></div>
          <div id="proposals"></div>
        </section>
      </aside>
      <button id="network-panel-scrim" class="network-panel-scrim" type="button" aria-label="关闭侧栏" hidden></button>
    </main>

    <button id="ai-chat-mobile" class="ai-chat-mobile" type="button" aria-label="打开 AI 对话" aria-controls="ai-chat-panel" aria-expanded="false">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4Z"></path><path d="M8.5 9h7M8.5 12h4"></path></svg>
    </button>
    <div id="ai-chat-scrim" class="ai-chat-scrim" hidden></div>
    <aside id="ai-chat-panel" class="ai-chat-panel" aria-label="归云 AI 对话" aria-hidden="true" hidden>
      <header class="ai-chat-header">
        <div><span>当前网络</span><h2>归云助手</h2></div>
        <div>
          <button id="ai-chat-new" type="button" aria-label="新建对话" title="新建对话">＋</button>
          <button id="ai-chat-close" type="button" aria-label="关闭 AI 对话" title="关闭">×</button>
        </div>
      </header>
      <div class="ai-chat-context">
        <label>会话<select id="ai-chat-conversation" aria-label="切换会话"></select></label>
        <label>对话范围<select id="ai-chat-intent">
          <option value="net_answer">问当前网络</option>
          <option value="net_search">检索当前网络</option>
          <option value="general_chat">通用对话</option>
          <option value="translate">翻译</option>
        </select></label>
      </div>
      <div id="ai-chat-messages" class="ai-chat-messages" aria-live="polite"></div>
      <form id="ai-chat-form" class="ai-chat-composer">
        <label class="sr-only" for="ai-chat-input">向归云助手提问</label>
        <textarea id="ai-chat-input" rows="3" maxlength="8000" placeholder="问问当前网络，Enter 发送，Shift+Enter 换行"></textarea>
        <div><small id="ai-chat-status">对话不会直接修改网络</small><button id="ai-chat-send" class="primary" type="submit">发送</button></div>
      </form>
    </aside>

    <div id="network-dialog" class="modal" role="dialog" aria-modal="true" hidden>
      <form id="network-form">
        <h2>新建知识网络</h2>
        <p class="empty">不同网络的节点、关系、总结和 AI 草案彼此隔离。</p>
        <label>网络名称<input id="network-name" maxlength="60" placeholder="例如：大学生职业成长" required /></label>
        <div><button type="button" id="network-cancel">取消</button><button class="primary">创建并切换</button></div>
      </form>
    </div>

    <div id="rename-network-dialog" class="modal" role="dialog" aria-modal="true" aria-labelledby="rename-network-title" hidden>
      <form id="rename-network-form">
        <h2 id="rename-network-title">重命名知识网络</h2>
        <label>网络名称<input id="rename-network-name" maxlength="60" required /></label>
        <div><button type="button" id="rename-network-cancel">取消</button><button class="primary">保存名称</button></div>
      </form>
    </div>

    <div id="network-trash-dialog" class="modal" role="dialog" aria-modal="true" aria-labelledby="network-trash-title" hidden>
      <section class="network-trash-card">
        <header><div><span>你的知识空间</span><h2 id="network-trash-title">网络回收站</h2></div><button id="network-trash-close" type="button" aria-label="关闭">×</button></header>
        <div id="network-trash-list" class="network-trash-list"></div>
      </section>
    </div>

    <div id="edge-dialog" class="modal" role="dialog" aria-modal="true" aria-labelledby="edge-dialog-title" hidden>
      <form id="edge-form" class="edge-create-form">
        <header>
          <div><span>归云网络 · 人工连接</span><h2 id="edge-dialog-title">新建连接</h2></div>
          <button type="button" id="edge-close" aria-label="关闭">×</button>
        </header>
        <div class="edge-form-body">
          <div class="edge-endpoint-grid">
            <label>起点节点<select id="edge-source" required></select></label>
            <span class="edge-direction" aria-hidden="true">↔</span>
            <label>目标节点<select id="edge-target" required></select></label>
          </div>
          <label>关系类型<select id="edge-relation"><option value="related">相关</option><option value="supports">支持</option><option value="supplements">补充</option><option value="contradicts">对照</option><option value="condition_of">条件</option><option value="example_of">示例</option></select></label>
          <label>关系标题<input id="edge-title" maxlength="200" required /></label>
          <label>关系说明（可选）<textarea id="edge-note" maxlength="10000" rows="3" placeholder="补充理由或依据"></textarea></label>
          <p id="edge-error" class="edge-form-error" hidden></p>
        </div>
        <footer><button type="button" id="edge-cancel">取消</button><button class="primary">创建关系</button></footer>
      </form>
    </div>

    <div id="node-dialog" class="modal" role="dialog" aria-modal="true" aria-labelledby="node-dialog-title" hidden>
      <form id="node-form" class="edge-create-form node-create-form">
        <header>
          <div><span>归云网络 · 人工节点</span><h2 id="node-dialog-title">新建节点</h2></div>
          <button type="button" id="node-close" aria-label="关闭">×</button>
        </header>
        <div class="edge-form-body">
          <label>节点标题<input id="node-title" maxlength="200" placeholder="例如：OAuth 回调安全" required /></label>
          <label>节点说明（可选）<textarea id="node-note" maxlength="10000" rows="4" placeholder="补充内容、依据或你的理解"></textarea></label>
          <p id="node-error" class="edge-form-error" hidden></p>
        </div>
        <footer><button type="button" id="node-cancel">取消</button><button class="primary">创建节点</button></footer>
      </form>
    </div>

    <div id="toast"></div>
    <script type="module" src="/src/network-app.js"></script>
  </body>
</html>
