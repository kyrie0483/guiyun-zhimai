<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="把知乎内容中的关键文段归档为知识节点，再进行连接与总结。"
    />
    <link
      rel="icon"
      href="/assets/guiyun-mark.svg"
    />
    <title>归云·知脉｜阅读</title>
    <link rel="stylesheet" href="/assets/styles/styles.css" />
    <link rel="stylesheet" href="/assets/styles/ui.css" />
  </head>
  <body class="reading-page">
    <header class="topbar reading-topbar">
      <a class="brand brand-link" href="/">
        <b>归云·知脉</b>
      </a>
      <nav>
        <button id="hot">知乎热榜</button>
        <a id="network-link" class="button network-entry" href="/network" aria-label="进入归云网络">
          <svg class="network-entry-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 5 4 12l8 7 7-9M7 5l5 14"></path><circle cx="7" cy="5" r="2"></circle><circle cx="4" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle><circle cx="19" cy="10" r="2"></circle></svg>
          <span>0 节点</span><b>进入归云网络 →</b>
        </a>
        <button id="reading-ai-chat-toggle" class="reading-ai-toggle" type="button" aria-label="打开阅读 AI 助手" aria-controls="reading-ai-chat-panel" aria-expanded="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4Z"></path><path d="M8.5 9h7M8.5 12h4"></path></svg>
          <span>问原文</span>
        </button>
        <span id="api-state" class="badge">检查接口…</span>
        <a id="login" class="button primary" href="/api/auth/zhihu/start">知乎登录</a>
      </nav>
    </header>

    <section class="searchbar">
      <form id="search-form">
        <input
          id="search-input"
          maxlength="200"
          placeholder="搜索知乎真实经验，例如：大学生第一份实习"
        />
        <button class="primary">搜索知乎</button>
      </form>
      <p id="search-message" role="status" aria-live="polite" hidden></p>
    </section>

    <main class="workspace reading-workspace">
      <aside class="panel results">
        <div class="heading"><b>阅读来源</b></div>
        <div id="personal-sources"></div>
        <div class="source-divider">知乎发现</div>
        <div id="results"></div>
        <div class="reading-sidebar-utilities" role="toolbar" aria-label="阅读设置">
          <button id="reading-ai-settings" class="network-utility-button" type="button" aria-label="打开 AI 设置与用量" data-tooltip="AI 设置与用量">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"></path><circle cx="12" cy="12" r="3.5"></circle></svg>
            <span class="sr-only">AI 设置与用量</span>
          </button>
        </div>
      </aside>
      <section class="panel reader">
        <div id="reader-empty" class="empty hero">
          <b>从一段真实阅读开始</b>
        </div>
        <div id="reader-view" hidden>
          <header>
            <span id="source-badge" class="badge">知乎来源</span>
            <h1 id="article-title"></h1>
            <p id="article-meta"></p>
            <div>
              <button id="archive-article" class="guiyun-reader-archive">
                <span class="guiyun-mark" aria-hidden="true"></span><span>归档文档至网络</span>
              </button>
              <a
                id="open-original"
                class="button"
                target="_blank"
                rel="noopener noreferrer"
              >打开原文</a>
            </div>
          </header>
          <article id="article-content"></article>
          <p class="tip">选中文字后点击浮动按钮；归档完成后可进入独立的归云网络页面。</p>
        </div>
      </section>
    </main>

    <div id="selection-popover" class="popover guiyun-selection-popover" role="toolbar" aria-label="所选文字操作" hidden>
      <div id="selection-actions" class="selection-tool-group">
        <button id="copy-selection" class="selection-tool" type="button" aria-label="复制所选文字" title="复制所选文字">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
        </button>
        <button id="ask-ai-selection" class="selection-tool" type="button" aria-label="向 AI 询问所选文字" title="询问归云助手">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4Z"></path><path d="M8.5 9h7M8.5 12h4"></path></svg>
        </button>
        <button id="archive-selection" class="selection-tool" type="button" aria-label="归档所选对象至网络" title="归档所选对象至网络">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 5 4 12l8 7 7-9M7 5l5 14"></path><circle cx="7" cy="5" r="2"></circle><circle cx="4" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle><circle cx="19" cy="10" r="2"></circle></svg>
        </button>
        <button id="highlight-selection" class="selection-tool" type="button" aria-label="为所选文字添加高亮" title="添加高亮">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"></path><path d="m22 12-7.2 7.2a2 2 0 0 1-2.8 0l-7.2-7.2a2 2 0 0 1 0-2.8L12 2z"></path></svg>
        </button>
      </div>
      <div id="highlight-colors" class="selection-tool-group highlight-colors" aria-label="选择高亮颜色" hidden>
        <button type="button" data-highlight-color="yellow" aria-label="使用黄色高亮所选文字" title="黄色"></button>
        <button type="button" data-highlight-color="red" aria-label="使用红色高亮所选文字" title="红色"></button>
        <button type="button" data-highlight-color="orange" aria-label="使用橙色高亮所选文字" title="橙色"></button>
        <button type="button" data-highlight-color="green" aria-label="使用绿色高亮所选文字" title="绿色"></button>
        <button type="button" data-highlight-color="purple" aria-label="使用紫色高亮所选文字" title="紫色"></button>
        <button id="remove-highlight" class="remove-highlight" type="button" aria-label="取消所选文字的高亮" title="取消高亮">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 21 4-4"></path><path d="m5.5 13.5 5 5a2 2 0 0 0 2.8 0l6.2-6.2a2 2 0 0 0 0-2.8l-5-5a2 2 0 0 0-2.8 0l-6.2 6.2a2 2 0 0 0 0 2.8Z"></path><path d="M14 19h7"></path></svg>
        </button>
      </div>
    </div>

    <div id="archive-dialog" class="modal archive-picker" role="dialog" aria-modal="true" hidden>
      <section class="archive-picker-card">
        <header>
          <div><span class="archive-kicker">归云 · 主动归档</span><h2>选择目标网络</h2></div>
          <button type="button" id="archive-cancel" class="archive-close" aria-label="关闭">×</button>
        </header>
        <div id="archive-source-summary" class="archive-source-summary"></div>
        <div id="archive-targets" class="archive-targets" role="list"></div>
      </section>
    </div>

    <aside id="archive-success" class="archive-success" aria-live="polite" hidden>
      <button id="archive-success-close" aria-label="关闭">×</button>
      <span class="guiyun-mark" aria-hidden="true"></span>
      <div><b id="archive-success-message">归档完成</b><small>已加入待整合队列</small></div>
      <a id="archive-success-link" class="button primary" href="/network">前往网络</a>
    </aside>

    <div id="reading-ai-chat-scrim" class="ai-chat-scrim" hidden></div>
    <aside id="reading-ai-chat-panel" class="ai-chat-panel reading-ai-chat-panel" aria-label="归云阅读 AI 助手" aria-hidden="true" hidden>
      <header class="ai-chat-header">
        <div><span id="reading-ai-source-label">当前阅读</span><h2>归云助手</h2></div>
        <div>
          <button id="reading-ai-settings-inline" class="reading-ai-settings-link" type="button" aria-label="打开 AI 设置与用量" title="AI 设置与用量">⚙</button>
          <button id="reading-ai-chat-new" type="button" aria-label="新建对话" title="新建对话">＋</button>
          <button id="reading-ai-chat-close" type="button" aria-label="关闭 AI 助手" title="关闭">×</button>
        </div>
      </header>
      <div class="ai-chat-context">
        <label>会话<select id="reading-ai-chat-conversation" aria-label="切换会话"></select></label>
        <label>对话范围<select id="reading-ai-chat-intent">
          <option value="note_answer">问当前原文</option>
          <option value="note_search">检索阅读资料</option>
          <option value="general_chat">通用对话</option>
          <option value="translate">翻译</option>
        </select></label>
      </div>
      <div id="reading-ai-chat-messages" class="ai-chat-messages" aria-live="polite"></div>
      <form id="reading-ai-chat-form" class="ai-chat-composer">
        <label class="sr-only" for="reading-ai-chat-input">向归云助手提问</label>
        <textarea id="reading-ai-chat-input" rows="3" maxlength="8000" placeholder="围绕当前原文提问，Enter 发送，Shift+Enter 换行"></textarea>
        <div><small id="reading-ai-chat-status">回答不会修改原文或网络</small><button id="reading-ai-chat-send" class="primary" type="submit">发送</button></div>
      </form>
    </aside>

    <div id="ai-settings-dialog" class="modal" role="dialog" aria-modal="true" aria-labelledby="reading-ai-settings-title" hidden>
      <form id="ai-settings-form" class="edge-create-form ai-settings-form">
        <header>
          <div><span>归云阅读助手</span><h2 id="reading-ai-settings-title">AI 设置与用量</h2></div>
          <button type="button" id="ai-settings-close" aria-label="关闭">×</button>
        </header>
        <div class="edge-form-body ai-settings-body">
          <fieldset class="ai-mode-picker">
            <legend>使用方式</legend>
            <label><input type="radio" name="ai-mode" value="trial"><span><b>站点试用</b><small>登录后使用共享额度</small></span></label>
            <label><input type="radio" name="ai-mode" value="own"><span><b>自带 API Key</b><small>Key 仅保存在当前标签页</small></span></label>
          </fieldset>
          <p id="ai-trial-status" class="ai-trial-status">读取额度中…</p>
          <section id="ai-own-settings">
            <div class="ai-model-grid">
              <label>供应商<select id="ai-provider"></select></label>
              <label>模型<select id="ai-model"></select></label>
            </div>
            <label>API Key<input id="ai-api-key" type="password" autocomplete="off" maxlength="1000" placeholder="输入所选供应商的 API Key"></label>
          </section>
          <p class="ai-security-note">所选原文会发送给模型；请勿提交敏感信息。</p>
        </div>
        <footer><button type="button" id="ai-settings-cancel">取消</button><button class="primary">保存设置</button></footer>
      </form>
    </div>
    <button id="reading-ai-chat-mobile" class="ai-chat-mobile reading-ai-chat-mobile" type="button" aria-label="打开阅读 AI 助手" aria-controls="reading-ai-chat-panel" aria-expanded="false">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4Z"></path><path d="M8.5 9h7M8.5 12h4"></path></svg>
    </button>

    <nav class="mobile-tabs" aria-label="移动端阅读工作区">
      <button data-panel="sources" class="active">阅读来源</button>
      <button data-panel="reader">正文阅读</button>
    </nav>
    <div id="toast"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
