services:
  - type: web
    name: guiyun-zhimai
    runtime: docker
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ZHIHU_ACCESS_SECRET
        sync: false
      - key: ZHIHU_OAUTH_APP_ID
        sync: false
      - key: ZHIHU_OAUTH_APP_KEY
        sync: false
      - key: ZHIHU_OAUTH_REDIRECT_URI
        sync: false
      - key: AI_TRIAL_PROVIDER
        value: deepseek
      - key: AI_TRIAL_MODEL
        value: deepseek-v4-flash
      - key: AI_TRIAL_API_KEY
        sync: false
      - key: AI_TRIAL_TOKEN_LIMIT
        value: 20000
      - key: AI_MAX_OUTPUT_TOKENS
        value: 2000
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
